name: Manual Windows contracts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, verified tag
        with:
          persist-credentials: false
      - name: Parse Windows PowerShell 5.1 scripts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Out-String | Write-Error; throw 'PowerShell syntax check failed' }
          }
      - name: Verify pinned source and build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $lock=Get-Content config/dependencies.lock.json -Raw | ConvertFrom-Json
          if (-not (Get-Command cmake.exe -ErrorAction SilentlyContinue)) { throw 'Hosted runner is missing CMake' }
          if (-not (Get-Command ctest.exe -ErrorAction SilentlyContinue)) { throw 'Hosted runner is missing CTest' }
          Invoke-WebRequest -Uri $lock.boost.url -OutFile boost.tar.gz -UseBasicParsing
          if ((Get-FileHash boost.tar.gz -Algorithm SHA256).Hash -ine $lock.boost.sha256) { throw 'Dependency checksum mismatch' }
          cmake -E tar xzf boost.tar.gz
          if ($LASTEXITCODE -ne 0) { throw 'Dependency extraction failed' }
          $boost=Join-Path $PWD $lock.boost.directory
          cmake -S . -B build-ci -G 'Visual Studio 17 2022' -A x64 "-DOW_BOOST_ROOT=$boost" -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw 'Native configure failed' }
          cmake --build build-ci --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Native compilation failed' }
          ctest --test-dir build-ci -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Native behavior contracts failed' }
# Deliberately no push schedule, release, deployment, signing or production secrets.
